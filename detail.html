<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Editor Gambar - Detail</title>
</head>
<body>
    <header>
        <h1>Detail Aset Gambar</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda (Daftar Gambar)</a></li>
                <li><a href="editor.html">Editor Pemotong Gambar</a></li>
                <li><a href="detail.html">Detail Gambar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <header>
                <h2>hasrusnya foto.png</h2>
                <p>ini foto</p>
            </header>
            
            <section>
                <img src="foto-profil-karyawan.png" alt="ini foto tapi blm ada fotonya" width="300">
                
                <h3>Metadata</h3>
                <ul>
                    <li><strong>Resolusi:</strong> 800 x 800 Piksel</li>
                    <li><strong>Ukuran File:</strong> 150 KB(kayaknya)</li>

            <section>
                <h3>Catatan Revisi Gambar</h3>
                <form action="#" method="POST">
                    <p>
                        <label for="catatanAdmin">Tambahkan Catatan:</label><br>
                        <textarea id="catatanAdmin" name="catatanAdmin" rows="4" cols="50" placeholder="Tulis catatan mengenai aset ini..."></textarea>
                    </p>
                    <button type="submit">Simpan Catatan</button>
                </form>
            </section>
        </article>

    <footer>
        <p>Ini web html</p>
