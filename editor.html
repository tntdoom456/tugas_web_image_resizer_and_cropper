<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ImageCrop - Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        img {
            display: block;
            max-width: 100%;
        }

        .cropper-container {
            max-height: 700px;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">ImageCrop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="editor.html">Ruang
                            Kerja</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail.html">Detail Gambar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">Langkah 1: Pengaturan</div>
                    <div class="card-body">
                        <form id="form-cropper">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="imageLoader" class="form-label fw-semibold">Pilih Gambar</label>
                                    <input class="form-control" type="file" id="imageLoader" accept="image/*">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="targetW" class="form-label fw-semibold">Lebar (px)</label>
                                    <input type="number" class="form-control" id="targetW" value="800">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="targetH" class="form-label fw-semibold">Tinggi (px)</label>
                                    <input type="number" class="form-control" id="targetH" value="600">
                                </div>
                            </div>
                            <!-- Tombol aksi -->
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <button id="btn-update-ratio" class="btn btn-outline-secondary w-100 fw-bold">Update Rasio Potong</button>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <button id="btn-crop" class="btn btn-primary w-100 fw-bold">Proses Potong</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 mb-5">
                    <div class="card-header bg-white fw-bold py-3">Langkah 2: Pratinjau</div>
                    <div class="card-body" id="area-pratinjau">
                        <div class="row g-4 text-center align-items-center">
                            <div class="col-lg-7">
                                <div class="p-3 border rounded bg-white cropper-container-wrapper">
                                    <h6 class="text-muted mb-3">Gambar Asli (Area Potong)</h6>
                                    <img id="image" src="" alt="Area gambar asli">
                                </div>
                            </div>
                            <div class="col-lg-5">
                                <div class="p-3 border rounded bg-light d-flex flex-column align-items-center justify-content-center h-100" style="min-height: 300px;">
                                    <h6 class="text-muted mb-3">Hasil Potongan Akhir</h6>
                                    <img id="result" src="" class="img-fluid rounded border shadow-sm mb-3" alt="Hasil potongan">
                                    <button id="btn-download" class="btn btn-success fw-bold px-5" style="display: none;">Unduh Gambar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 mt-4 border-top">
        <small>Ini tugas</small>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
