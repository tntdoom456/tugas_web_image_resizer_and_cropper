<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ImageCrop - Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">ImageCrop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="editor.html">Ruang Kerja</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail.html">Detail Gambar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white fw-bold py-3">Langkah 1: Pengaturan</div>
                    <div class="card-body">
                        <form action="detail.html" method="GET">
                            <div class="mb-3">
                                <label for="imageLoader" class="form-label fw-semibold">Pilih Gambar</label>
                                <input class="form-control" type="file" id="imageLoader" name="imageLoader" accept="image/*">
                            </div>
                            <div class="mb-3">
                                <label for="targetW" class="form-label fw-semibold">Lebar (px)</label>
                                <input type="number" class="form-control" id="targetW" value="800">
                            </div>
                            <div class="mb-4">
                                <label for="targetH" class="form-label fw-semibold">Tinggi (px)</label>
                                <input type="number" class="form-control" id="targetH" value="600">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Proses Potong</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white fw-bold py-3">Langkah 2: Pratinjau</div>
                    <div class="card-body">
                        <div class="row g-3 text-center">
                            <div class="col-md-6">
                                <div class="p-3 border rounded bg-light h-100">
                                    <h6 class="text-muted">Gambar Asli</h6>
                                    <img src="gambar-asli.jpeg" class="img-fluid rounded border shadow-sm mt-2" alt="Gambar asli">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded bg-light h-100">
                                    <h6 class="text-muted">Hasil Potongan</h6>
                                    <img src="gambar-hasil.png" class="img-fluid rounded border shadow-sm mt-2" alt="Gambar dipotong">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4 mt-4 border-top">
        <small>Ini tugas</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
